    <style>
      :root {
        --bg: #090909;
        --surface: #111;
        --text: #f7f7f4;
        --muted: #9b9b96;
        --accent: #00b5e2;
        --line: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(
            circle at 50% 0%,
            rgba(0, 181, 226, 0.12),
            transparent 32%
          ),
          linear-gradient(180deg, #0a0a0a, #080808);
        font-family: "Geist", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .nav {
        position: fixed;
        inset: 0 0 auto;
        z-index: 10;
        border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        background: rgba(9, 9, 9, 0.84);
        backdrop-filter: blur(16px);
      }

      .nav-inner {
        width: min(1240px, calc(100% - 48px));
        min-height: 72px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        width: max-content;
      }

      .brand img {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        object-fit: contain;
      }

      .wordmark {
        font-size: 22px;
        font-weight: 560;
        line-height: 1;
        letter-spacing: -0.052em;
        transform: translateY(-0.5px);
      }

      .wordmark span {
        color: var(--accent);
      }

      .simono-v3-mark {
        display: block !important;
        width: auto !important;
        height: 32px !important;
        width: 24.27px !important;
        max-width: none !important;
        overflow: visible !important;
        flex: 0 0 auto !important;
        object-fit: contain !important;
        filter: none !important;
      }
      .simono-v3-wordmark {
        display: inline !important;
        margin: 0 !important;
        padding: 0 !important;
        font-family:
          "Geist",
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif !important;
        font-size: 21px !important;
        font-weight: 500 !important;
        font-style: normal !important;
        line-height: 1 !important;
        letter-spacing: -0.045em !important;
        color: #f7f7f4 !important;
        font-kerning: normal !important;
        font-variant-ligatures: common-ligatures !important;
        -webkit-font-smoothing: antialiased !important;
        -moz-osx-font-smoothing: grayscale !important;
        text-rendering: geometricPrecision !important;
      }
      .simono-v3-o {
        display: inline !important;
        color: #00b5e2 !important;
        font: inherit !important;
        line-height: inherit !important;
        letter-spacing: inherit !important;
        vertical-align: baseline !important;
      }
      .nav-links {
        justify-self: center !important;
      }
      .nav-cta {
        justify-self: end !important;
      }
      .hero {
        padding-top: 124px !important;
      }
      .footer .simono-v3-mark {
        height: 28px !important;
      }
      .footer .simono-v3-wordmark {
        font-size: 19px !important;
      }
      .footer .brand {
        gap: 7px !important;
      }
      @media (max-width: 1050px) {
        .nav-inner {
          display: flex !important;
          min-height: 68px !important;
        }
        .simono-v3-mark {
          height: 29px !important;
        }
        .simono-v3-wordmark {
          font-size: 20px !important;
        }
      }
      @media (max-width: 720px) {
        .nav .container {
          width: min(100% - 28px, 1240px) !important;
        }
        .nav-inner {
          min-height: 64px !important;
        }
        .simono-v3-mark {
          height: 27px !important;
        }
        .simono-v3-wordmark {
          font-size: 18px !important;
        }
        .footer .simono-v3-mark {
          height: 25px !important;
        }
        .footer .simono-v3-wordmark {
          font-size: 17px !important;
        }
        .hero {
          padding-top: 106px !important;
        }
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 120px 24px 56px;
      }

      .panel {
        width: min(820px, 100%);
        padding: clamp(34px, 7vw, 72px);
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(17, 17, 17, 0.76);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.28);
      }

      .code {
        color: var(--accent);
        font:
          500 0.72rem "Geist Mono",
          monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin-top: 24px;
        font-size: clamp(3rem, 8vw, 6.5rem);
        line-height: 0.96;
        letter-spacing: -0.065em;
      }

      h1 span {
        display: block;
        color: #8f8f8a;
      }

      p {
        max-width: 620px;
        margin: 28px auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.16rem);
        line-height: 1.7;
      }

      .actions {
        margin-top: 36px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        min-height: 48px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        border: 1px solid rgba(0, 181, 226, 0.4);
        background: rgba(0, 181, 226, 0.1);
        transition: 0.22s ease;
      }

      .button:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        background: rgba(0, 181, 226, 0.16);
      }

      .button.secondary {
        border-color: var(--line);
        background: transparent;
        color: var(--muted);
      }

      .button.secondary:hover {
        color: var(--text);
        border-color: rgba(255, 255, 255, 0.24);
      }

      @media (max-width: 1050px) {
        .brand img {
          width: 33px;
          height: 33px;
          flex-basis: 33px;
        }

        .wordmark {
          font-size: 21px;
        }
      }

      @media (max-width: 560px) {
        .nav-inner {
          width: min(100% - 32px, 1240px);
        }

        .brand {
          gap: 4px;
        }

        .brand img {
          width: 30px;
          height: 30px;
          flex-basis: 30px;
        }

        .wordmark {
          font-size: 19px;
        }

        .panel {
          border-radius: 22px;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
